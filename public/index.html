<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrition Assistant Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-success mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">🍏 Nutrition Assistant</span>
    </div>
  </nav>

  <div class="container">
    <div class="row">
      <!-- Add Log Form -->
      <div class="col-md-4 mb-4">
        <div class="card p-4">
          <h4 class="mb-3 text-success">Log a Meal</h4>
          <form id="logForm">
            <div class="mb-3">
              <label class="form-label">Meal Type</label>
              <select id="mealType" class="form-select" required>
                <option value="Breakfast">Breakfast</option>
                <option value="Lunch">Lunch</option>
                <option value="Dinner">Dinner</option>
                <option value="Snack">Snack</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Food Item</label>
              <input type="text" id="foodItem" class="form-control" placeholder="e.g., Oatmeal, Chicken Rice" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Calories (kcal)</label>
              <input type="number" id="calories" class="form-control" min="0" required>
            </div>
            <div class="row">
              <div class="col-4 mb-3">
                <label class="form-label">Protein (g)</label>
                <input type="number" id="protein" class="form-control" min="0" value="0">
              </div>
              <div class="col-4 mb-3">
                <label class="form-label">Carbs (g)</label>
                <input type="number" id="carbs" class="form-control" min="0" value="0">
              </div>
              <div class="col-4 mb-3">
                <label class="form-label">Fats (g)</label>
                <input type="number" id="fats" class="form-control" min="0" value="0">
              </div>
            </div>
            <button type="submit" class="btn btn-success w-100">Add Entry</button>
          </form>
        </div>
      </div>

      <!-- Dashboard View -->
      <div class="col-md-8">
        <div class="card p-4">
          <h4 class="mb-4 text-dark">Daily Consumption Log</h4>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Meal</th>
                  <th>Food Item</th>
                  <th>Calories</th>
                  <th>Macros (P/C/F)</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="logTableBody">
                <!-- Data dynamically loads here -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="public/app.js"></script>
</body>
</html>
